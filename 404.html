<!-- Motion boot. Adding the class here (rather than from motion.js) is what
     prevents a flash of un-animated content: the hide rules apply on the very
     first paint. The timeout is the safety net -- if motion.js has not
     confirmed it is alive, the class comes off and the page is simply static
     and complete. Content is never left depending on a script that failed. -->
<script>
  (function () {
    var r = document.documentElement;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    r.classList.add('js-motion');
    setTimeout(function () {
      if (!window.__bwMotionReady) r.classList.remove('js-motion');
    }, 2000);
  })();
</script>
