<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="700" viewBox="0 0 1800 700" role="img" aria-labelledby="title desc">
  <title id="title">Bridgeway Medical Logistics</title>
  <desc id="desc">Bridgeway Medical Logistics logo with a speed-streak B, medical cross, heartbeat line, and Reliable Fast Secure tagline.</desc>

  <defs>
    <linearGradient id="bGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1677FF"/>
      <stop offset="45%" stop-color="#1557D6"/>
      <stop offset="100%" stop-color="#0B2A78"/>
    </linearGradient>
  </defs>

  <!-- Speed streaks -->
  <g fill="url(#bGrad)">
    <rect x="92" y="150" width="210" height="28" rx="14"/>
    <rect x="48" y="205" width="240" height="28" rx="14"/>
    <rect x="110" y="260" width="190" height="28" rx="14"/>
    <rect x="58" y="315" width="235" height="28" rx="14"/>
    <rect x="98" y="370" width="190" height="28" rx="14"/>
    <rect x="44" y="425" width="240" height="28" rx="14"/>
    <rect x="105" y="480" width="185" height="28" rx="14"/>
  </g>

  <!-- Stylized B -->
  <path fill="url(#bGrad)" d="
    M260 125
    H430
    C520 125 585 170 585 245
    C585 290 562 326 522 348
    C572 370 600 415 600 470
    C600 555 530 610 425 610
    H260 Z

    M370 205
    V310
    H430
    C465 310 485 290 485 258
    C485 225 463 205 430 205 Z

    M370 390
    V525
    H440
    C480 525 505 500 505 458
    C505 415 480 390 440 390 Z
  "/>

  <!-- Medical cross -->
  <g fill="#FFFFFF">
    <rect x="335" y="270" width="72" height="190" rx="8"/>
    <rect x="275" y="330" width="190" height="72" rx="8"/>
  </g>

  <!-- Divider -->
  <line x1="660" y1="135" x2="660" y2="585" stroke="#0A1F3D" stroke-width="8"/>

  <!-- Brand text -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="740" y="300" font-size="150" font-weight="700" fill="#071C4C">BRIDGEWAY</text>
    <text x="742" y="405" font-size="86" font-weight="500" letter-spacing="10" fill="#1759E6">MEDICAL LOGISTICS</text>
  </g>

  <!-- Heartbeat line -->
  <path d="M748 485 H1120 L1148 485 L1162 460 L1180 520 L1200 440 L1220 500 L1240 470 L1257 485 H1655"
        fill="none" stroke="#1759E6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Tagline -->
  <text x="840" y="590"
        font-family="Arial, Helvetica, sans-serif"
        font-size="54"
        font-weight="500"
        letter-spacing="14"
        fill="#5E6673">RELIABLE. FAST. SECURE.</text>
</svg>
